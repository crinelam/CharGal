[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CharacterGallery"
description = "A Gallery for your Characters."
version = "0.0.1"
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	     "PySide6==6.11.0.*",
	     "platformdirs>=4.9.6",
	     ]

[tool.hatch.targets.wheel]
packages = ["src/CharGal"]